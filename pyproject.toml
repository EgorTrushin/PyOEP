[project]
name = "PyOEP"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "basis-set-exchange>=0.12",
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "psutil>=7.2.2",
    "pyscf>=2.14.0",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "scipy>=1.18.1",
    "threadpoolctl>=3.6.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[[tool.uv.index]]
name = "numpy-mkl"
url = "https://urob.github.io/numpy-mkl"
explicit = true

[tool.uv.sources]
numpy = { index = "numpy-mkl" }
scipy = { index = "numpy-mkl" }

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "NPY", "RUF"]

# En dash is correct in the journal page ranges cited in docstrings (1667–1683).
allowed-confusables = ["–"]

[tool.ruff.lint.per-file-ignores]
# Vendored from https://github.com/andyzynlove/FCNN_XC_Potential; kept close to
# upstream. RUF059 names (doo/dov/dvo/dvv, dovov/dvvvv/...) are pyscf's
# occupied/virtual block convention, not throwaway variables.
"**/relaxed_ccsd.py" = ["RUF059", "SIM102"]

[tool.ruff.lint.isort]
known-first-party = ["methods", "utils"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
